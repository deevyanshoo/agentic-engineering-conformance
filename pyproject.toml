[build-system]
requires = ['setuptools>=75']
build-backend = 'setuptools.build_meta'

[project]
name = 'coderpolice'
version = '0.1.0a2'
description = 'Open-source agentic engineering conformance benchmark for coding-agent stacks'
readme = 'README.md'
requires-python = '>=3.11'
license = 'Apache-2.0'
dependencies = ['jsonschema>=4.23,<5']

[project.optional-dependencies]
dev = ['mypy>=1.13', 'pytest>=8.3', 'ruff>=0.9', 'types-jsonschema>=4.23']

[tool.pytest.ini_options]
addopts = '--strict-markers --strict-config'
testpaths = ['tests']

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B', 'SIM', 'RUF']

[tool.mypy]
python_version = '3.11'
strict = true
packages = ['agentic_conformance']
