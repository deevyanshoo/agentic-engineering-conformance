name: Bug report
description: Report a reproducible deterministic defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private host transcripts, or unrelated repository data.
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Full Git SHA or release version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands and synthetic inputs only.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed and expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Deterministic evidence
      description: Test output, result classification, and relevant sanitized artifact digests.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private transcripts, private reasoning, and unnecessary machine identifiers.
          required: true